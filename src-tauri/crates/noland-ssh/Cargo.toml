[package]
name = "noland-ssh"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
russh = { version = "=0.63.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=2.1.1"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.10"
