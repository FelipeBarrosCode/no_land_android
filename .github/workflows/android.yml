name: Android CI and preview release

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  version:
    name: Determine mobile release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve version and unique CI build number
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="android-v${version}-build.${build_number}"
          fi
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.abi }} debug APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64
          - target: x86_64
            rust_target: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
      - name: Select the pinned Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          cmake_bin="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin"
          test -f "${ndk}/build/cmake/android.toolchain.cmake"
          test -x "${cmake_bin}/cmake"
          test -x "${cmake_bin}/ninja"
          {
            echo "NDK_HOME=${ndk}"
            echo "ANDROID_NDK_HOME=${ndk}"
            echo "CMAKE=${cmake_bin}/cmake"
          } >> "$GITHUB_ENV"
          echo "$cmake_bin" >> "$GITHUB_PATH"
          cat "${ndk}/source.properties"
          "${cmake_bin}/cmake" --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.abi }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate Android source and shared frontend
        run: |
          npm run check:android
          npm run i18n:check
          npm run build
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Generate the Tauri Android project
        run: npm run tauri:android:init
      - name: Build ${{ matrix.abi }} debug APK
        run: npx tauri android build --debug --target ${{ matrix.target }} --config src-tauri/tauri.android.conf.json
      - name: Stage APK and checksum
        shell: bash
        run: |
          mkdir -p artifacts
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)
          test -n "$apk"
          output="artifacts/no-land-android-${{ needs.version.outputs.version }}-${{ needs.version.outputs.build_number }}-${{ matrix.abi }}-debug.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "artifacts/SHA256SUMS-${{ matrix.abi }}"
      - name: Upload Android preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-land-android-${{ matrix.abi }}-debug-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  preview-release:
    name: Publish versioned Android preview
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated APKs
        uses: actions/download-artifact@v4
        with:
          pattern: no-land-android-*-debug-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: No Land Android ${{ needs.version.outputs.version }} (${{ needs.version.outputs.build_number }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          make_latest: ${{ github.ref_type == 'tag' }}
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS-*
