name: App Store Connect

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed IPA to TestFlight/App Store Connect
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: app-store-connect
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 120
    environment: app-store
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: src-tauri/native/third_party/wireguard-apple/Sources/WireGuardKitGo/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Require App Store SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          [[ "${sdk_version%%.*}" -ge 26 ]]
      - name: Install project tools
        run: brew install xcodegen
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Set and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "ios-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version ios-v$version" >&2
            exit 1
          fi
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          npm run set:ios:build-number -- "$build_number"
          npm run check:ios:release
          {
            echo "version=$version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"
      - name: Require App Store secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APP_PROFILE_BASE64 TUNNEL_PROFILE_BASE64 APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "$name: missing" >&2; missing=1; else echo "$name: present"; fi
          done
          test "$missing" -eq 0
      - name: Import App Store signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/noland-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APP_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$TUNNEL_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/tunnel.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/tunnel.mobileprovision" > "$RUNNER_TEMP/tunnel-profile.plist"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/app-profile.plist")"
          tunnel_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/tunnel-profile.plist")"
          [[ "$app_identifier" == "U66WLT4SP6.noland.main.app" ]]
          [[ "$tunnel_identifier" == "U66WLT4SP6.noland.main.app.PacketTunnel" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/app-profile.plist")" == "false" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/tunnel-profile.plist")" == "false" ]]
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.networking.networkextension' "$RUNNER_TEMP/app-profile.plist" | grep -q 'packet-tunnel-provider'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.networking.networkextension' "$RUNNER_TEMP/tunnel-profile.plist" | grep -q 'packet-tunnel-provider'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -E 'Apple Distribution|iPhone Distribution'
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          app_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app-profile.plist")"
          tunnel_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/tunnel-profile.plist")"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$app_uuid.mobileprovision"
          cp "$RUNNER_TEMP/tunnel.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$tunnel_uuid.mobileprovision"
          echo "NOLAND_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Generate Xcode project and signed App Store IPA
        run: |
          set -euo pipefail
          npm run tauri:ios:init
          set +e
          npm run tauri:ios:build -- \
            --target aarch64 \
            --ci \
            --build-number "${{ steps.release.outputs.build_number }}" \
            --export-method app-store-connect
          tauri_status=$?
          set -e
          ARCHIVE="$(find src-tauri/gen/apple/build -maxdepth 2 -type d -name '*.xcarchive' -print -quit)"
          if [[ -z "$ARCHIVE" || ! -d "$ARCHIVE" ]]; then
            echo "Tauri exited $tauri_status without producing an Xcode archive" >&2
            exit "${tauri_status:-1}"
          fi
          EXPORT_DIR="$GITHUB_WORKSPACE/src-tauri/gen/apple/build/app-store"
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist src-tauri/apple/ExportOptions-AppStore.plist
      - name: Locate and verify signed IPA
        id: ipa
        run: |
          set -euo pipefail
          IPA="$(find src-tauri/gen/apple/build/app-store -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          unzip -t "$IPA" >/dev/null
          PAYLOAD="$RUNNER_TEMP/ipa-payload"
          rm -rf "$PAYLOAD" && mkdir -p "$PAYLOAD"
          unzip -q "$IPA" -d "$PAYLOAD"
          APP="$(find "$PAYLOAD/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          EXTENSION="$APP/PlugIns/NolandPacketTunnel.appex"
          test -d "$APP" && test -d "$EXTENSION"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/embedded.mobileprovision"
          test -f "$EXTENSION/embedded.mobileprovision"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" == "noland.main.app" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXTENSION/Info.plist")" == "noland.main.app.PacketTunnel" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" == "${{ steps.release.outputs.version }}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" == "${{ steps.release.outputs.build_number }}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXTENSION/Info.plist")" == "${{ steps.release.outputs.build_number }}" ]]
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements :- "$EXTENSION" > "$RUNNER_TEMP/tunnel-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' "$RUNNER_TEMP/app-entitlements.plist" | grep -qx 'packet-tunnel-provider'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' "$RUNNER_TEMP/tunnel-entitlements.plist" | grep -qx 'packet-tunnel-provider'
      - uses: actions/upload-artifact@v4
        with:
          name: noland-connect-ios-${{ steps.release.outputs.version }}-${{ steps.release.outputs.build_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/tunnel.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
          if [[ -n "${NOLAND_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NOLAND_SIGNING_KEYCHAIN" || true
          fi
