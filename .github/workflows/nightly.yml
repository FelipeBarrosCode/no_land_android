name: Nightly Android rehearsal

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: nightly-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    uses: ./.github/workflows/android.yml
    with:
      publish: false
    secrets: inherit
