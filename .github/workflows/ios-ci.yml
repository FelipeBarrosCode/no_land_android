name: iOS CI

# Kept for cross-platform regression checks, but Android is this fork's default lane.
on:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: src-tauri/native/third_party/wireguard-apple/Sources/WireGuardKitGo/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install project tools
        run: brew install xcodegen
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate frontend and release inputs
        run: |
          npm run build
          npm run i18n:check
          npm run check:ios:release
      - name: Generate maintained Xcode project
        run: npm run tauri:ios:init
      - name: Compile iOS contracts and streaming backend
        run: |
          npm run check:ios:contracts
          npm run check:ios:streaming
      - name: Compile packet tunnel for Simulator
        run: npm run check:ios:vpn
      - name: Verify UIKit controller routing and reconnect lifecycle
        run: npm run check:ios:controls
